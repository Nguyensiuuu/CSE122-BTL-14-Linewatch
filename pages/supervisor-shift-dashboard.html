<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tổng quan ca · LineWatch</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/son.css" />

    <!-- Kiểm tra nếu chạy bằng file:// thì hiển thị thông báo lỗi hướng dẫn dùng Live Server -->
    <script>
      if (location.protocol === "file:") {
        document.addEventListener("DOMContentLoaded", function () {
          document.body.innerHTML = `
                    <div style="max-width:560px;margin:60px auto;font:16px/1.6 system-ui;padding:24px;border:2px solid #b07a2b;border-radius:12px;background:#fff;color:#1d2a24">
                        <h2>Chưa chạy qua máy chủ cục bộ</h2>
                        <p>Trang dùng ES module và fetch seed.json nên <b>không mở bằng double-click (file://)</b> được. Hãy mở thư mục dự án bằng <b>Live Server</b> (VS Code) hoặc chạy file <b>chay.bat</b> / <b>chay.sh</b>, rồi vào <b>http://localhost:8000/</b>.</p>
                    </div>
                `;
        });
      }
    </script>
  </head>
  <body
    data-role="supervisor"
    data-active="dashboard"
    data-title="Tổng quan ca"
  >
    <main id="main" class="main">
      <div id="view" aria-live="polite">
        <noscript>Cần bật JavaScript để dùng LineWatch.</noscript>
      </div>
    </main>

    <!-- JavaScript module chính cho trang tổng quan ca -->
    <script type="module" src="../js/page-dashboard.js"></script>
  </body>
</html>
