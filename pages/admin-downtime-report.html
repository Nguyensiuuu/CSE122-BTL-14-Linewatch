<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Báo cáo dừng máy · LineWatch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/son-base.css" />
    <link rel="stylesheet" href="../css/son.css" />

    <script>
      if (location.protocol === "file:") {
        document.addEventListener("DOMContentLoaded", function () {
          document.body.innerHTML = `
          <div style="max-width:560px;margin:60px auto;font:16px/1.6 system-ui;padding:24px;border:2px solid #b07a2b;border-radius:12px;background:#fff;color:#1d2a24">
            <h2>Chưa chạy qua máy chủ cục bộ</h2>
            <p>Trang dùng ES module và fetch seed.json nên <b>không mở bằng double-click (file://)</b> được. Hãy mở thư mục dự án bằng <b>Live Server</b> (VS Code) hoặc chạy <code>python -m http.server 8000</code> tại thư mục dự án, rồi vào <b>http://localhost:8000/</b>.</p>
          </div>
        `;
        });
      }
    </script>
</head>

  <body data-role="admin" data-active="downtime" data-title="Báo cáo dừng máy">
    <main id="main" class="main">
      <div id="view" aria-live="polite">
        <noscript>Cần bật JavaScript để dùng LineWatch.</noscript>
      </div>
    </main>

    <dialog id="dlg">
      <div></div>
      <form method="dialog" class="foot">
        <span class="sp"></span>
        <button class="btn">Đóng</button>
      </form>
    </dialog>

    <script type="module" src="../js/page-downtime.js"></script>
  </body>
</html>
