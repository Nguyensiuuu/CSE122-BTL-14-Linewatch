<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LineWatch · Kiểm tra thông tin đăng ký</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/screens.css">
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-shell">
        <section class="auth-hero">
          <div class="auth-hero-img" aria-hidden="true">
            <img src="../assets/images/linewatch-auth-hero.png" alt="">
          </div>
          <span class="hero-sr">LineWatch — Theo dõi ca sản xuất và sự cố dây chuyền</span>
        </section>

        <section class="auth-panel">
          <div class="auth-form auth-state">
            <span class="pill danger">22 · Lỗi nhập liệu</span>
            <h2 class="auth-state-title">Chưa gửi được đăng ký</h2>
            <p id="register-error-message" class="form-desc">Một số thông tin chưa đúng hoặc còn thiếu. Quay lại biểu mẫu để kiểm tra.</p>
            <div class="actions">
              <a class="btn primary" href="register.html">Quay lại đăng ký</a>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
