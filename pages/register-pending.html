<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LineWatch · Đăng ký đang chờ duyệt</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/screens.css">
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-shell">
        <section class="auth-hero">
          <div class="auth-hero-img" aria-hidden="true">
            <img src="../assets/images/linewatch-auth-hero.png" alt="">
          </div>
          <span class="hero-sr">LineWatch — Theo dõi ca sản xuất và sự cố dây chuyền</span>
        </section>

        <section class="auth-panel">
          <div class="auth-form auth-state">
            <span class="pill warn">23 · Đang chờ duyệt</span>
            <h2 class="auth-state-title">Yêu cầu đăng ký đã gửi</h2>

            <div class="pending-box">
              <span class="avatar" data-shell="avatar">?</span>
              <span>
                <span class="pending-mail" id="pending-user" data-shell="user-full">Thông tin đăng ký đã được lưu trong trình duyệt demo.</span>
                <span class="pending-role">Chờ quản trị viên duyệt</span>
              </span>
            </div>

            <div class="notice">Tài khoản hiện ở trạng thái <b>Chờ duyệt</b>. Bạn chưa thể đăng nhập bằng tài khoản này.</div>

            <div class="actions">
              <a class="btn primary" href="register.html">Tạo yêu cầu khác</a>
              <a class="btn" href="operator-line-status.html">Về trang demo</a>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
