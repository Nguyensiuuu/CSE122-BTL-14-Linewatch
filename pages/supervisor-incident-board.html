<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bảng điều phối · LineWatch</title>

    <!-- Nhúng Font chữ từ Google Fonts (Inter & Lora) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Nhúng các file CSS định dạng giao diện -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/son.css" />

    <!-- Kiểm tra nếu mở file trực tiếp (file://) thì hiện cảnh báo bắt buộc dùng Local Server -->
    <script>
      if (location.protocol === "file:") {
        document.addEventListener("DOMContentLoaded", function () {
          document.body.innerHTML = `
                    <div style="max-width:560px;margin:60px auto;font:16px/1.6 system-ui;padding:24px;border:2px solid #b07a2b;border-radius:12px;background:#fff;color:#1d2a24">
                        <h2>Chưa chạy qua máy chủ cục bộ</h2>
                        <p>Trang dùng ES module và fetch seed.json nên <b>không mở bằng double-click (file://)</b> được. 
                        Hãy mở thư mục dự án bằng <b>Live Server</b> (VS Code) hoặc chạy file <b>chay.bat</b> / <b>chay.sh</b>, 
                        rồi vào <b>http://localhost:8000/</b>.</p>
                    </div>
                `;
        });
      }
    </script>
  </head>

  <body data-role="supervisor" data-active="board" data-title="Bảng điều phối">
    <!-- Khu vực hiển thị nội dung chính của trang -->
    <main id="main" class="main">
      <div id="view" aria-live="polite">
        <!-- Thông báo dự phòng nếu trình duyệt tắt JavaScript -->
        <noscript>Cần bật JavaScript để dùng LineWatch.</noscript>
      </div>
    </main>

    <!-- Hộp thoại (Dialog) ẩn dùng để phân công nhiệm vụ cho kỹ thuật viên -->
    <dialog id="dlg" aria-labelledby="dt">
      <form method="dialog">
        <h3 id="dt">Phân công</h3>
        <p class="sub">
          Chọn kỹ thuật viên; hệ thống tạo nhiệm vụ bảo trì gắn với sự cố này.
        </p>

        <label for="as" class="sub">Kỹ thuật viên</label><br />
        <select id="as" required></select>

        <div class="foot">
          <span class="sp"></span>
          <button class="btn" value="cancel">Hủy</button>
          <button class="btn pri" value="ok">Phân công</button>
        </div>
      </form>
    </dialog>

    <!-- Nạp file JavaScript điều khiển riêng cho trang Bảng điều phối -->
    <script type="module" src="../js/page-board.js"></script>
  </body>
</html>
