<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LineWatch · Quản lý dây chuyền</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/thang-base.css">
    <link rel="stylesheet" href="../css/screens.css">
  <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/unified.css">
</head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Thanh điều hướng">
        <div class="brand">LINEWATCH<small>Theo dõi ca sản xuất</small></div>
        <span class="role">Quản trị viên</span>
        <nav class="nav">
          <a href="admin-machine-management.html">Danh mục máy</a>
          <a href="admin-line-management.html" class="active" aria-current="page">Quản lý dây chuyền</a>
          <a href="admin-downtime-report.html">Báo cáo dừng máy</a>
        </nav>
        <div class="shift">
          <div><span data-shell="shift-date">Ca hiện tại</span></div>
          <div data-shell="shift"><b>Ca 2 · 14:00–22:00</b></div>
          <div>Tổ A · Xưởng 01</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1>Quản lý dây chuyền</h1>
          <div class="topbar-meta">
            <span class="date" data-shell="date">—</span>
          </div>
        </header>

        <section class="content">
          <div class="page-head">
            <div>
              <h2>Quản lý dây chuyền</h2>
              <p>Danh sách dây chuyền và trạng thái vận hành hiện tại.</p>
            </div>
            <div class="head-aside">
              <button class="btn primary" id="add-line" type="button">＋ Thêm dây chuyền</button>
            </div>
          </div>

          <section class="panel">
            <div class="toolbar">
              <label class="search">
                <span class="hidden">Tìm dây chuyền</span>
                <input id="line-search" type="search" placeholder="Nhập mã hoặc tên dây chuyền">
              </label>
              <div class="chips">
                <label class="field">
                  <span class="hidden">Trạng thái</span>
                  <select id="line-status-filter">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="active">Đang chạy</option>
                    <option value="paused">Tạm dừng</option>
                  </select>
                </label>
              </div>
            </div>

            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">Mã</th>
                    <th scope="col">Tên dây chuyền</th>
                    <th scope="col">Số máy</th>
                    <th scope="col">Trạng thái</th>
                    <th scope="col" class="cell-right">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="admin-line-table"></tbody>
              </table>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
