<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LineWatch · Tạo tài khoản</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/thang-base.css">
    <link rel="stylesheet" href="../css/screens.css">
  <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/unified.css">
</head>
  <body>
    <main class="auth-page">
      <div class="auth-shell">
        <section class="auth-hero">
          <div class="auth-hero-img" aria-hidden="true">
            <img src="../assets/images/linewatch-auth-hero.png" alt="">
          </div>
          <span class="hero-sr">LineWatch — Theo dõi ca sản xuất và sự cố dây chuyền</span>
        </section>

        <section class="auth-panel">
          <form class="auth-form" id="register-form" novalidate>
            <button type="button" class="nut-chung doi-mau-xac-thuc" data-theme-toggle>◐ Chế độ tối</button>
            <h1 class="form-title">Tạo tài khoản</h1>
            <p class="form-desc">Điền thông tin của bạn để gửi yêu cầu đăng ký.</p>

            <div id="register-error" class="error form-error" role="alert" hidden></div>

            <div class="two-fields">
              <div class="field">
                <label for="fullName">Họ và tên</label>
                <input id="fullName" name="fullName" required minlength="2" maxlength="60" placeholder="Nguyễn Văn A" autocomplete="name">
              </div>
              <div class="field">
                <label for="employeeId">Mã nhân viên</label>
                <input id="employeeId" name="employeeId" required pattern="[A-Za-z0-9-]{3,20}" placeholder="NV-001" autocomplete="off">
              </div>
            </div>

            <div class="field">
              <label for="email">Email công ty</label>
              <input id="email" name="email" type="email" required placeholder="name@company.com" autocomplete="email">
            </div>

            <div class="two-fields">
              <div class="field">
                <label for="password">Mật khẩu</label>
                <input id="password" name="password" type="password" required minlength="8" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password">
              </div>
              <div class="field">
                <label for="confirmPassword">Nhập lại mật khẩu</label>
                <input id="confirmPassword" name="confirmPassword" type="password" required minlength="8" placeholder="Lặp lại mật khẩu" autocomplete="new-password">
              </div>
            </div>

            <label class="check">
              <input id="terms" type="checkbox" required>
              <span>Tôi xác nhận thông tin đăng ký là chính xác.</span>
            </label>

            <button class="btn primary" type="submit">Gửi yêu cầu đăng ký</button>
            <p class="form-foot">Đã có tài khoản? <a href="01-dang-nhap/login.html">Quay về đăng nhập</a></p>
          </form>
        </section>
      </div>
    </main>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
